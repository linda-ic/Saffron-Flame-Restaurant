{% extends 'core/base.html' %}
{% load static %}

{% block title %}Reservations{% endblock %}
{% block content %}
    <!-- RESERVATION HEADER HERO BANNER -->
    <section
        class="relative py-16 px-8 mb-10 flex flex-col items-center justify-center bg-cover bg-center border-b border-[#C6A54A]/20"
        style="background-image: linear-gradient(to bottom, rgba(8, 24, 21, 0.85), rgba(15, 38, 34, 0.9)), url('{% static 'images/reservations.png' %}');"
    >
        <div class="relative text-center z-10 max-w-3xl mx-auto">
            <div class="text-[#C6A54A] mb-3">
                <i class="bi bi-calendar-check text-7xl"></i>
            </div>
            <h1 class="text-5xl font-[PlayfairDisplay] font-bold text-[#C6A54A] tracking-wide">Table Reservations</h1>
            <p class="text-[#e6c057] mt-3 font-[Inter] text-lg">Reserve your table for an unforgettable fine dining experience.</p>
        </div>
    </section>

    <!-- FORM SECTION -->
    <div class="bg-[#0F2622] max-w-3xl rounded-3xl shadow-xl border border-[#e8d5a0]/10 md:mx-auto mx-4 p-8 font-[PlayfairDisplay] mt-4 mb-12">
        <form action="#" method="POST" class="text-center py-2 px-5">
            {% csrf_token %}
            <div>
                <label for="full-name" class="block font-semibold mb-3 font-[Inter]"><i class="bi bi-person"></i> Full Name</label>
                <input type="text" id="full-name" placeholder="Enter your full name here..." class="mb-3 w-full max-w-md mx-auto rounded-lg bg-[#081815] px-6 py-3 border border-[#C6A54A]/30 text-[#C6A54A] block">
            </div>
            <div>
                <label for="email" class="block font-semibold mb-3 font-[Inter]"><i class="bi bi-envelope-at"></i> Email</label>
                <input type="email" id="email" placeholder="Enter your email here..." class="mb-3 w-full max-w-md mx-auto rounded-lg bg-[#081815] px-6 py-3 border border-[#C6A54A]/30 text-[#C6A54A] block">
            </div>
            <div>
                <label for="date" class="block font-semibold mb-3 font-[Inter]"><i class="bi bi-calendar-event"></i> Date</label>
                <input type="date" id="date" class="mb-3 w-full max-w-md mx-auto rounded-lg bg-[#081815] px-6 py-3 border border-[#C6A54A]/30 text-[#C6A54A] block">
            </div>
            <div>
                <label for="time" class="block font-semibold mb-3 font-[Inter]"><i class="bi bi-clock-history"></i> Time</label>
                <input type="time" id="time" class="mb-3 w-full max-w-md mx-auto rounded-lg bg-[#081815] px-6 py-3 border border-[#C6A54A]/30 text-[#C6A54A] block">
            </div>
            <div>
                <label for="guests" class="font-semibold block mb-3 font-[Inter]"><i class="bi bi-person-plus"></i> Number of Guests</label>
                <select name="guests" id="guests" class="mb-3 w-full max-w-md mx-auto rounded-lg bg-[#081815] px-6 py-3 border border-[#C6A54A]/30 text-[#C6A54A] cursor-pointer block">
                    <option>1 Guest</option>
                    <option>2 Guests</option>
                    <option>3 Guests</option>
                    <option>4 Guests</option>
                    <option>5+ Guests</option>
                </select>
            </div>
            <div>
                <label for="requests" class="block font-semibold mb-3 font-[Inter]"><i class="bi bi-pencil-square"></i> Special Requests</label>
                <textarea name="requests" id="requests" rows="3" placeholder="Allergies, celebrations, etc." class="mb-3 w-full max-w-md mx-auto rounded-lg bg-[#081815] px-6 py-3 border border-[#C6A54A]/30 text-[#C6A54A] block"></textarea>
            </div>
            <button type="submit" class="bg-[#b3933b] text-[#081815] font-[Inter] cursor-pointer hover:shadow-md hover:shadow-[#C6A54A]/30 transition w-full max-w-md py-4 rounded-lg font-semibold mt-5"><i class="bi bi-calendar-check"></i> Confirm Reservation</button>
        </form>
    </div>
{% endblock %}
